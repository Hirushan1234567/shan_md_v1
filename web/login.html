<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030409"><title>SHAN MINI BOT - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:radial-gradient(ellipse at top,#071b3b,#030409 65%);color:#fff;font:13px Poppins,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.b{width:100%;max-width:400px;padding:26px 22px;border:1px solid rgba(0,195,255,.5);border-radius:20px;background:rgba(5,12,28,.98)}h1{font:900 20px Orbitron;color:#00c8ff;text-align:center}p{color:#a7b8d4;font-size:11px;text-align:center;margin:6px 0 16px}
label{font-size:11px;color:#c0d2e8}input{width:100%;padding:11px;margin:4px 0 12px;background:#050b18;border:1px solid #1b3554;color:#fff;border-radius:8px}
button{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;background:linear-gradient(90deg,#00c8ff,#00f0c8);color:#001018;cursor:pointer}a{display:block;text-align:center;color:#a7b8d4;margin-top:12px;font-size:11px}#e{color:#ff5577;font-size:11px;min-height:16px;margin-top:8px;text-align:center}</style></head>
<body><form class="b" id="f"><h1>BOT LOGIN</h1><p>Bot number + the API key sent to your WhatsApp</p>
<label>Bot WhatsApp Number</label><input id="n" type="tel" placeholder="947XXXXXXXX" required autocomplete="username">
<label>API Key</label><input id="k" type="password" placeholder="SHAN-XXXX-XXXX-XXXX-XXXX" required autocomplete="current-password">
<button>LOGIN</button><div id="e" role="alert"></div><a href="/">← Home</a></form>
<script>const $=i=>document.getElementById(i);
fetch("/api/me").then(r=>r.ok&&(location.href="/dashboard")).catch(()=>{});
$("f").onsubmit=async e=>{e.preventDefault();$("e").textContent="Checking...";
try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number:$("n").value.replace(/\D/g,""),apiKey:$("k").value.trim()})});
const d=await r.json();if(d.ok)location.href="/dashboard";else $("e").textContent=d.error||"Failed"}catch{$("e").textContent="Network error"}};</script></body></html>
